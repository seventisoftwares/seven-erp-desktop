name: Seven ERP Desktop Installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "seven-erp-v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Seven-ERP-Windows
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS Universal
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: Seven-ERP-macOS
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar versão para download
    if: startsWith(github.ref, 'refs/tags/seven-erp-v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Seven-ERP-Windows
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: Seven-ERP-macOS
          path: artifacts/macos
      - uses: softprops/action-gh-release@v2
        with:
          name: Seven ERP Desktop ${{ github.ref_name }}
          body: |
            Instaladores oficiais do Seven ERP Desktop.

            - Windows x64: arquivo `.exe`
            - macOS Universal: arquivos `.dmg` e `.zip`
            - Sidecar fiscal/reporting .NET 8 self-contained incluído no aplicativo.

            Esta compilação mantém o núcleo local-first Seven Mesh e inclui a plataforma open source de relatórios/fiscal.
          files: |
            artifacts/windows/*.exe
            artifacts/macos/*.dmg
            artifacts/macos/*.zip
          fail_on_unmatched_files: true
