name: Desktop Lockfile Sync

on:
  push:
    branches:
      - feat/nfe-real-authorization
    paths:
      - desktop/package.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nfe-real-authorization
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "seven-erp-ci"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync desktop package lock"
          git push origin HEAD:feat/nfe-real-authorization
