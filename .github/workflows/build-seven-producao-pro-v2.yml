name: Build Seven Producao Pro v2

on:
  push:
    branches:
      - build-seven-producao-pro-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild and validate source
        shell: pwsh
        run: |
          $b64 = (Get-Content -Raw 'build-assets/chunk00.txt') + (Get-Content -Raw 'build-assets/chunk01.txt') + (Get-Content -Raw 'build-assets/chunk02.txt') + (Get-Content -Raw 'build-assets/chunk03.txt') + (Get-Content -Raw 'build-assets/chunk04.txt')
          $b64 = $b64 -replace '\s',''
          [System.IO.File]::WriteAllBytes('source.zip', [System.Convert]::FromBase64String($b64))
          $hash = (Get-FileHash source.zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256=$hash"
          if ($hash -ne '25c53e1bff55a3a0437d9659e7387242c40e7d03899f7f6a7d70cc81c8947485') { throw "Source checksum mismatch" }
          New-Item -ItemType Directory -Force build-app | Out-Null
          Expand-Archive -Path source.zip -DestinationPath build-app -Force
      - name: Install dependencies
        working-directory: build-app
        run: npm install --no-audit --no-fund
      - name: Build Windows NSIS
        working-directory: build-app
        run: npx electron-builder --win nsis --x64
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Seven-Producao-Pro-v2-Windows-x64
          path: build-app/dist/*.exe
          if-no-files-found: error

  macos:
    name: macOS universal installer
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild and validate source
        run: |
          cat build-assets/chunk00.txt build-assets/chunk01.txt build-assets/chunk02.txt build-assets/chunk03.txt build-assets/chunk04.txt | tr -d '\r\n\t ' > source.b64
          base64 --decode source.b64 > source.zip
          echo "SHA256=$(shasum -a 256 source.zip | awk '{print $1}')"
          test "$(shasum -a 256 source.zip | awk '{print $1}')" = "25c53e1bff55a3a0437d9659e7387242c40e7d03899f7f6a7d70cc81c8947485"
          mkdir -p build-app
          unzip -q source.zip -d build-app
      - name: Install dependencies
        working-directory: build-app
        run: npm install --no-audit --no-fund
      - name: Build macOS DMG and ZIP universal
        working-directory: build-app
        run: npx electron-builder --mac dmg zip --universal
      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: Seven-Producao-Pro-v2-macOS-Universal
          path: |
            build-app/dist/*.dmg
            build-app/dist/*.zip
          if-no-files-found: error
