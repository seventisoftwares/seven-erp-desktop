name: Build Seven AutoERP Windows

on:
  workflow_dispatch:
  push:
    branches:
      - autoerp-windows-build
    paths:
      - 'autoerp-windows/**'
      - '.github/workflows/autoerp-windows-build.yml'

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify AutoERP source bundle
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'autoerp-windows/bundle/part*.b64' | Sort-Object Name
          if ($parts.Count -ne 10) { throw "Bundle incompleto: esperadas 10 partes, encontradas $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { (Get-Content -Raw $_.FullName).Trim() }) -join ''
          if ($b64.Length -ne 49836) { throw "Base64 incompleto: tamanho $($b64.Length), esperado 49836." }
          $zip = 'Seven-AutoERP-Windows-v1.0.0-source.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'f0ce8f85c244177aab97eddffb95dd8da5b72700ae17d8f95054b9b5535c39db') {
            throw "SHA256 do bundle invalido: $hash"
          }
          New-Item -ItemType Directory -Force -Path autoerp-src | Out-Null
          Expand-Archive -Path $zip -DestinationPath autoerp-src -Force
          if (-not (Test-Path 'autoerp-src/package.json')) { throw 'package.json nao encontrado apos extracao.' }
          Write-Host "Bundle validado: $hash"

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: pwsh
        working-directory: autoerp-src
        run: npm install --no-audit --no-fund

      - name: Typecheck
        shell: pwsh
        working-directory: autoerp-src
        run: npm run typecheck

      - name: Build Windows installer
        shell: pwsh
        working-directory: autoerp-src
        run: npm run dist:win

      - name: Generate SHA256
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'autoerp-src/release/*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Instalador EXE nao encontrado.' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content 'autoerp-src/release/SHA256.txt'
          Get-ChildItem 'autoerp-src/release' | Format-Table Name,Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Seven-AutoERP-Windows-v1.0.0
          path: |
            autoerp-src/release/*.exe
            autoerp-src/release/*.blockmap
            autoerp-src/release/latest*.yml
            autoerp-src/release/SHA256.txt
          if-no-files-found: error
          retention-days: 30
